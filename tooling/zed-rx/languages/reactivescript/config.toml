name = "ReactiveScript"
grammar = "rx"
# Zed matches a suffix against the file name's last dot segment, so "rx" covers .d.rx too.
path_suffixes = ["rx"]
code_fence_block_names = ["rx", "reactivescript"]
line_comments = ["// "]
block_comment = { start = "/*", prefix = "* ", end = "*/", tab_size = 1 }
wrap_characters = { start_prefix = "<", start_suffix = ">", end_prefix = "</", end_suffix = ">" }
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "`", end = "`", close = true, newline = false, not_in = ["string"] },
    { start = "/*", end = " */", close = true, newline = false, not_in = ["string", "comment"] },
]
word_characters = ["#", "$"]
tab_size = 2

# The rx grammar keeps TSX's JSX node names.
[jsx_tag_auto_close]
open_tag_node_name = "jsx_opening_element"
close_tag_node_name = "jsx_closing_element"
jsx_element_node_name = "jsx_element"
tag_name_node_name = "identifier"
tag_name_node_name_alternates = ["member_expression"]

# The scopes overrides.scm captures.
[overrides.default]
linked_edit_characters = [".", "-"]

[overrides.element]
line_comments = { remove = true }
block_comment = { start = "{/*", prefix = "", end = "*/}", tab_size = 1 }

[overrides.string]
completion_query_characters = ["-", "."]
prefer_label_for_snippet = true

[overrides.function_name_before_type_arguments]
prefer_label_for_snippet = true
